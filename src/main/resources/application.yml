spring:
  application:
    name: agentic-url-shortener
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DB_USERNAME:urlshortener}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  short-url:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    code-length: ${SHORT_CODE_LENGTH:7}
    max-original-url-length: 2048
  governance:
    control-token: ${AGENT_CONTROL_TOKEN:local-demo-control-token}
    approval-token: ${APPROVAL_TOKEN:local-demo-approval-token}
    max-node-retries: ${MAX_NODE_RETRIES:2}
    max-run-duration-seconds: ${MAX_RUN_DURATION_SECONDS:300}
    autonomous-actions: ${AUTONOMOUS_ACTIONS:REQUIREMENTS,CODEBASE_REASONING,IMPACT_ANALYSIS,AMBIGUITY_REVIEW,ARCHITECTURE,IMPLEMENTATION,DOCUMENTATION,TESTING,RELEASE_READINESS}

logging:
  pattern:
    level: "%5p [trace=%X{traceId}]"
  level:
    root: INFO
    com.example.agenticurl: INFO
